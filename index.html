    <script type="text/babel">
        const { useState, useEffect } = React;

        // Utility: Array shuffling helper
        const shuffleArray = (array) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        };

        const ScatterPlot = ({ data, type = 'positive' }) => {
            const [hoveredPoint, setHoveredPoint] = useState(null);

            return (
                <div className="w-full flex flex-col items-center justify-center relative my-2">
                    <svg viewBox="0 0 320 220" className="w-full h-auto max-h-64 bg-slate-900 rounded-xl p-3 shadow-inner">
                        {/* Grid lines */}
                        <line x1="40" y1="20" x2="40" y2="180" stroke="#334155" strokeWidth="1.5" />
                        <line x1="40" y1="180" x2="300" y2="180" stroke="#334155" strokeWidth="1.5" />
                        
                        {/* Axis Labels */}
                        <text x="170" y="210" fontSize="10" fill="#94a3b8" textAnchor="middle" fontWeight="bold">Variabel X (Independen)</text>
                        <text x="15" y="100" fontSize="10" fill="#94a3b8" textAnchor="middle" transform="rotate(-90 15 100)" fontWeight="bold">Variabel Y (Dependen)</text>
                        
                        {/* Data Points */}
                        {data.map((pt, idx) => {
                            const cx = 40 + (pt.x / 100) * 250;
                            const cy = 180 - (pt.y / 100) * 150;
                            const isHovered = hoveredPoint === idx;

                            return (
                                <g key={idx} className="cursor-pointer">
                                    <circle
                                        cx={cx}
                                        cy={cy}
                                        r={isHovered ? "8" : "5"}
                                        fill={type === 'positive' ? '#3b82f6' : type === 'negative' ? '#ef4444' : '#facc15'}
                                        stroke="#ffffff"
                                        strokeWidth="1.5"
                                        className="transition-all duration-150"
                                        onMouseEnter={() => setHoveredPoint(idx)}
                                        onMouseLeave={() => setHoveredPoint(null)}
                                        onClick={() => setHoveredPoint(idx)}
                                    />
                                </g>
                            );
                        })}
                    </svg>

                    {/* Interactive Point Tooltip */}
                    <div className="mt-2 min-h-[36px] w-full text-center text-xs sm:text-sm font-semibold text-slate-700 bg-slate-100 px-3 py-2 rounded-lg border border-slate-200">
                        {hoveredPoint !== null ? (
                            <span className="text-brand-blue font-bold">
                                <i className="fa-solid fa-location-dot mr-1 text-red-500"></i> Data #{hoveredPoint + 1}: Nilai X = {data[hoveredPoint].x}, Nilai Y = {data[hoveredPoint].y}
                            </span>
                        ) : (
                            <span className="text-slate-500 italic">
                                <i className="fa-solid fa-hand-pointer mr-1 text-brand-lightBlue"></i> Klik / arahkan kursor ke titik untuk melihat koordinat data
                            </span>
                        )}
                    </div>
                </div>
            );
        };

                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900 bg-opacity-80 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full border-t-4 border-brand-blue">
                                <h3 className="text-xl sm:text-2xl font-bold text-brand-blue mb-2">Identitas Sertifikat</h3>
                                <p className="text-slate-600 text-xs sm:text-sm mb-4">Silakan masukkan data diri Anda sebelum mengunduh sertifikat PDF.</p>
                                
                                <div className="space-y-4 mb-6 text-left">
                                    <div>
                                        <label className="block text-xs sm:text-sm font-bold text-slate-700 mb-1">Nama Lengkap</label>
                                        <input type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full border border-slate-300 px-3 py-2 rounded-xl focus:ring-2 focus:ring-brand-blue outline-none text-sm" placeholder="Contoh: Budi Santoso" />
                                    </div>
                                    <div>
                                        <label className="block text-xs sm:text-sm font-bold text-slate-700 mb-1">Kelas</label>
                                        <input type="text" value={studentClass} onChange={e=>setStudentClass(e.target.value)} className="w-full border border-slate-300 px-3 py-2 rounded-xl focus:ring-2 focus:ring-brand-blue outline-none text-sm" placeholder="Contoh: XII MIPA 1" />
                                    </div>
                                </div>

                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setShowModal(false)} className="px-4 py-2 rounded-xl text-slate-600 bg-slate-100 hover:bg-slate-200 font-semibold transition text-sm">Batal</button>
                                    <button onClick={generatePDF} className="px-4 py-2 rounded-xl text-white bg-brand-blue hover:bg-brand-lightBlue font-bold shadow-md transition text-sm flex items-center gap-2">
                                        <i className="fa-solid fa-download"></i> Buat PDF
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = useState('home');
            const [finalScore, setFinalScore] = useState({ correct: 0, total: 10 });

            return (
                <div className="app-container">
                    {page !== 'home' && <TopNav current={page} setPage={setPage} />}
                    
                    <main className="flex-1 flex flex-col overflow-hidden">
                        {page === 'home' && <HomeView setPage={setPage} />}
                        {page === 'tujuan' && <TujuanView setPage={setPage} />}
                        {page === 'materi' && <MateriView setPage={setPage} />}
                        {page === 'kuis' && <QuizView setPage={setPage} setFinalScore={setFinalScore} />}
                        {page === 'hasil' && <ResultView setPage={setPage} finalScore={finalScore} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
